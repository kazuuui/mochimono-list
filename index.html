<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>持ち物・購入リスト</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f0ece4;
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 48px;
    background-image: repeating-linear-gradient(
      transparent, transparent 31px, #ddd5c8 31px, #ddd5c8 32px
    );
  }

  .notebook {
    max-width: 720px;
    margin: 0 auto;
    background: #fdfaf5;
    border-radius: 4px;
    box-shadow: 3px 4px 24px rgba(0,0,0,0.18), -1px 0 0 #e8e0d4;
    overflow: hidden;
    position: relative;
  }

  .notebook::before {
    content: '';
    position: absolute;
    left: 40px;
    top: 0; bottom: 0;
    width: 1px;
    background: #e0c8b0;
    z-index: 1;
  }

  .header {
    background: #1a2744;
    padding: 28px 28px 22px 60px;
  }

  .header h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 22px;
    color: #f5e6c8;
    letter-spacing: 0.08em;
    font-weight: 700;
  }

  .header p {
    font-size: 11px;
    color: #8a9abc;
    margin-top: 4px;
    letter-spacing: 0.12em;
  }

  .stats-bar {
    display: flex;
    gap: 24px;
    padding: 14px 28px 14px 60px;
    background: #232f52;
    border-bottom: 3px solid #c9971e;
  }

  .stat { text-align: center; }
  .stat-num {
    font-size: 18px;
    font-weight: 700;
    color: #f5d87a;
    font-family: 'Noto Serif JP', serif;
  }
  .stat-label {
    font-size: 10px;
    color: #8a9abc;
    letter-spacing: 0.1em;
    display: block;
  }

  .form-area {
    padding: 20px 24px 20px 56px;
    border-bottom: 1px solid #e8ddd0;
    background: #fef9f0;
  }

  .form-title {
    font-size: 11px;
    color: #8a7a66;
    letter-spacing: 0.15em;
    margin-bottom: 12px;
    font-weight: 500;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 120px 1fr 100px;
    gap: 10px;
    align-items: end;
  }

  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 10px; color: #9a8a76; letter-spacing: 0.1em; }
  .field input, .field select {
    border: none;
    border-bottom: 1.5px solid #c8b89a;
    background: transparent;
    padding: 6px 2px;
    font-size: 13px;
    font-family: 'Noto Sans JP', sans-serif;
    color: #2a1f14;
    outline: none;
    width: 100%;
    transition: border-color 0.2s;
  }
  .field input:focus, .field select:focus { border-bottom-color: #c9971e; }

  .form-row2 {
    display: grid;
    grid-template-columns: 1fr 1fr 80px;
    gap: 10px;
    margin-top: 10px;
    align-items: end;
  }

  .add-btn {
    background: #1a2744;
    color: #f5e6c8;
    border: none;
    padding: 8px 16px;
    border-radius: 2px;
    font-size: 12px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: background 0.2s;
    height: 36px;
  }
  .add-btn:hover { background: #c9971e; color: #1a2744; }

  .filter-bar {
    display: flex;
    gap: 8px;
    padding: 12px 24px 12px 56px;
    border-bottom: 1px solid #e8ddd0;
    align-items: center;
    flex-wrap: wrap;
  }

  .filter-label { font-size: 10px; color: #9a8a76; }

  .filter-btn {
    font-size: 11px;
    padding: 3px 10px;
    border: 1px solid #c8b89a;
    background: transparent;
    border-radius: 20px;
    cursor: pointer;
    color: #6a5a4a;
    font-family: 'Noto Sans JP', sans-serif;
    transition: all 0.15s;
  }
  .filter-btn.active { background: #1a2744; color: #f5e6c8; border-color: #1a2744; }

  .list-header {
    display: grid;
    grid-template-columns: 36px 90px 1fr 90px 80px 90px 36px;
    gap: 8px;
    padding: 8px 16px 8px 56px;
    font-size: 10px;
    color: #9a8a76;
    letter-spacing: 0.1em;
    border-bottom: 1.5px solid #c9971e;
    background: #fef9f0;
  }

  .list-body { min-height: 120px; }

  .list-item {
    display: grid;
    grid-template-columns: 36px 90px 1fr 90px 80px 90px 36px;
    gap: 8px;
    padding: 10px 16px 10px 56px;
    border-bottom: 1px solid #ece4d8;
    align-items: center;
    transition: background 0.15s;
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .list-item:hover { background: #fef5e4; }
  .list-item.bought { opacity: 0.55; }
  .list-item.bought .item-name { text-decoration: line-through; color: #9a8a76; }

  .check-box {
    width: 22px; height: 22px;
    border: 1.5px solid #c8b89a;
    border-radius: 2px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.15s;
    color: transparent;
    background: white;
    flex-shrink: 0;
  }
  .check-box:hover { border-color: #c9971e; }
  .check-box.checked {
    background: #1a2744;
    border-color: #1a2744;
    color: #f5d87a;
    animation: stamp 0.2s ease;
  }

  @keyframes stamp {
    0%   { transform: scale(1.4); }
    60%  { transform: scale(0.9); }
    100% { transform: scale(1); }
  }

  .item-date { font-size: 11px; color: #9a8a76; }
  .item-name { font-size: 13px; color: #2a1f14; font-weight: 500; }
  .item-cat  { font-size: 11px; }
  .item-price {
    font-size: 13px;
    color: #1a2744;
    font-weight: 700;
    text-align: right;
    font-family: 'Noto Serif JP', serif;
  }
  .item-memo { font-size: 11px; color: #7a6a5a; }

  .del-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #c8b89a;
    font-size: 14px;
    padding: 2px;
    transition: color 0.15s;
    text-align: center;
  }
  .del-btn:hover { color: #c0392b; }

  .cat-tag {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 2px;
    font-size: 10px;
    font-weight: 500;
  }

  .empty-msg {
    text-align: center;
    padding: 40px;
    color: #b0a090;
    font-size: 13px;
    font-style: italic;
  }

  .total-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 12px;
    padding: 12px 24px 12px 56px;
    border-top: 1.5px solid #c9971e;
    background: #fef9f0;
  }

  .total-label { font-size: 12px; color: #6a5a4a; letter-spacing: 0.1em; }
  .total-amount {
    font-size: 20px;
    font-weight: 700;
    color: #1a2744;
    font-family: 'Noto Serif JP', serif;
  }

  .cat-食料品   { background:#fde8d8; color:#c0541a; }
  .cat-日用品   { background:#dff0e8; color:#1a7a4a; }
  .cat-衣類     { background:#e8e0f8; color:#5a2aaa; }
  .cat-電化製品 { background:#ddeeff; color:#1a4aaa; }
  .cat-趣味     { background:#fef0cc; color:#8a6a00; }
  .cat-その他   { background:#ece8e4; color:#5a4a3a; }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr 1fr; }
    .form-row2 { grid-template-columns: 1fr 1fr; }
    .list-header, .list-item {
      grid-template-columns: 28px 1fr 60px 28px;
    }
    .list-header span:nth-child(2),
    .list-header span:nth-child(4),
    .list-header span:nth-child(6),
    .list-item .item-date,
    .list-item .item-cat,
    .list-item .item-memo { display: none; }
  }
</style>
</head>
<body>
<div class="notebook">
  <div class="header">
    <h1>持ち物・購入リスト</h1>
    <p>ITEM &amp; PURCHASE RECORD</p>
  </div>

  <div class="stats-bar">
    <div class="stat">
      <span class="stat-num" id="total-count">0</span>
      <span class="stat-label">総件数</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="bought-count">0</span>
      <span class="stat-label">購入済</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="total-amount">¥0</span>
      <span class="stat-label">合計金額</span>
    </div>
  </div>

  <div class="form-area">
    <div class="form-title">＋ 新規追加</div>
    <div class="form-grid">
      <div class="field">
        <label>購入日</label>
        <input type="date" id="inp-date">
      </div>
      <div class="field">
        <label>品目名</label>
        <input type="text" id="inp-name" placeholder="例：ワイヤレスイヤホン">
      </div>
      <div class="field">
        <label>金額（円）</label>
        <input type="number" id="inp-price" placeholder="0" min="0">
      </div>
    </div>
    <div class="form-row2">
      <div class="field">
        <label>カテゴリ</label>
        <select id="inp-cat">
          <option>食料品</option>
          <option>日用品</option>
          <option>衣類</option>
          <option>電化製品</option>
          <option>趣味</option>
          <option>その他</option>
        </select>
      </div>
      <div class="field">
        <label>メモ</label>
        <input type="text" id="inp-memo" placeholder="備考など">
      </div>
      <button class="add-btn" onclick="addItem()">追加</button>
    </div>
  </div>

  <div class="filter-bar">
    <span class="filter-label">絞込：</span>
    <button class="filter-btn active" onclick="setFilter('全て',this)">全て</button>
    <button class="filter-btn" onclick="setFilter('未購入',this)">未購入</button>
    <button class="filter-btn" onclick="setFilter('購入済',this)">購入済</button>
    <button class="filter-btn" onclick="setFilter('食料品',this)">食料品</button>
    <button class="filter-btn" onclick="setFilter('日用品',this)">日用品</button>
    <button class="filter-btn" onclick="setFilter('衣類',this)">衣類</button>
    <button class="filter-btn" onclick="setFilter('電化製品',this)">電化製品</button>
    <button class="filter-btn" onclick="setFilter('趣味',this)">趣味</button>
    <button class="filter-btn" onclick="setFilter('その他',this)">その他</button>
  </div>

  <div class="list-header">
    <span></span>
    <span>購入日</span>
    <span>品目</span>
    <span>カテゴリ</span>
    <span style="text-align:right">金額</span>
    <span>メモ</span>
    <span></span>
  </div>

  <div class="list-body" id="list-body">
    <div class="empty-msg">まだ登録されていません。上のフォームから追加してください。</div>
  </div>

  <div class="total-row">
    <span class="total-label">表示中の合計</span>
    <span class="total-amount" id="filtered-total">¥0</span>
  </div>
</div>

<script>
  let items = [];
  let currentFilter = '全て';
  let nextId = 1;

  document.getElementById('inp-date').value = new Date().toISOString().slice(0,10);

  function addItem() {
    const name  = document.getElementById('inp-name').value.trim();
    const date  = document.getElementById('inp-date').value;
    const price = parseInt(document.getElementById('inp-price').value) || 0;
    const cat   = document.getElementById('inp-cat').value;
    const memo  = document.getElementById('inp-memo').value.trim();
    if (!name) { document.getElementById('inp-name').focus(); return; }
    items.unshift({ id: nextId++, name, date, price, cat, memo, bought: false });
    document.getElementById('inp-name').value = '';
    document.getElementById('inp-price').value = '';
    document.getElementById('inp-memo').value = '';
    render();
  }

  function toggleBought(id) {
    const item = items.find(i => i.id === id);
    if (item) item.bought = !item.bought;
    render();
  }

  function deleteItem(id) {
    items = items.filter(i => i.id !== id);
    render();
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function filtered() {
    if (currentFilter === '全て') return items;
    if (currentFilter === '未購入') return items.filter(i => !i.bought);
    if (currentFilter === '購入済') return items.filter(i => i.bought);
    return items.filter(i => i.cat === currentFilter);
  }

  function fmtDate(d) {
    if (!d) return '—';
    const [y,m,day] = d.split('-');
    return `${y}/${m}/${day}`;
  }

  function fmtPrice(p) {
    return p ? '¥' + p.toLocaleString() : '—';
  }

  function render() {
    const list = filtered();
    const body = document.getElementById('list-body');
    document.getElementById('total-count').textContent = items.length;
    document.getElementById('bought-count').textContent = items.filter(i=>i.bought).length;
    const totalAmt = items.filter(i=>i.bought).reduce((s,i)=>s+i.price,0);
    document.getElementById('total-amount').textContent = '¥' + totalAmt.toLocaleString();
    const filteredAmt = list.reduce((s,i)=>s+i.price,0);
    document.getElementById('filtered-total').textContent = '¥' + filteredAmt.toLocaleString();

    if (list.length === 0) {
      body.innerHTML = '<div class="empty-msg">該当する項目がありません。</div>';
      return;
    }

    body.innerHTML = list.map(item => `
      <div class="list-item ${item.bought ? 'bought' : ''}">
        <div class="check-box ${item.bought ? 'checked' : ''}" onclick="toggleBought(${item.id})">✓</div>
        <span class="item-date">${fmtDate(item.date)}</span>
        <span class="item-name">${item.name}</span>
        <span class="item-cat"><span class="cat-tag cat-${item.cat}">${item.cat}</span></span>
        <span class="item-price">${fmtPrice(item.price)}</span>
        <span class="item-memo">${item.memo || '—'}</span>
        <button class="del-btn" onclick="deleteItem(${item.id})" title="削除">✕</button>
      </div>
    `).join('');
  }

  render();
</script>
</body>
</html>
