<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>持ち物・購入リスト</title>
<!-- ファビコン。data: URI で埋め込むとタブには出るが、Chrome はブックマーク用の
     アイコンとして保存してくれない（URL単位で保存する仕組みのため）。
     ブックマークにも反映されるよう、実ファイルとして置いて URL で参照する。 -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="theme-color" content="#1a2744">
<style>
  /* Amazon のUIを参考にした配色・書体。
     色: 濃紺のヘッダー、オレンジのアクセント、価格は赤、リンクは青緑。
     書体: Amazon Ember は配布されていないため、同社が指定するフォールバック
           （Arial 系）とmacOS/日本語の標準書体を並べている。 */

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --nb-width: 1000px;
    --nb-zoom: 1;

    --az-navy:      #131921;   /* 上部ヘッダー */
    --az-navy2:     #232F3E;   /* 二段目のバー */
    --az-orange:    #FF9900;   /* アクセント */
    --az-yellow:    #FFD814;   /* 主ボタン */
    --az-yellow-br: #FCD200;
    --az-link:      #007185;   /* リンク */
    --az-link-h:    #C7511F;   /* リンク hover */
    --az-price:     #B12704;   /* 価格 */
    --az-bg:        #EAEDED;   /* ページ背景 */
    --az-line:      #D5D9D9;   /* 罫線 */
    --az-line2:     #E7E7E7;
    --az-text:      #0F1111;   /* 本文 */
    --az-sub:       #565959;   /* 補助テキスト */
  }

  body {
    background: var(--az-bg);
    font-family: "Amazon Ember", -apple-system, BlinkMacSystemFont,
                 "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    color: var(--az-text);
    min-height: 100vh;
    padding: 0 0 40px;
    -webkit-font-smoothing: antialiased;
  }

  .notebook {
    max-width: var(--nb-width);
    zoom: var(--nb-zoom);
    margin: 0 auto;
    background: transparent;
  }

  /* ---- ヘッダー（Amazon の黒いナビゲーション） ---- */

  .header {
    background: var(--az-navy);
    padding: 10px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .header h1 {
    font-size: 19px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.01em;
    line-height: 1.25;
  }

  .header p {
    font-size: 10px;
    color: #CCC;
    margin-top: 1px;
    letter-spacing: 0.06em;
  }

  /* ---- 表示サイズ切替 ---- */

  .size-ctrl { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
  .size-row { display: flex; align-items: center; gap: 5px; }
  .size-row > span { font-size: 11px; color: #CCC; margin-right: 2px; }

  .size-btn {
    font-size: 11px;
    padding: 3px 9px;
    border: 1px solid #5A6A7A;
    background: transparent;
    border-radius: 4px;
    cursor: pointer;
    color: #DDD;
    font-family: inherit;
    transition: all 0.12s;
    white-space: nowrap;
  }
  .size-btn:hover { border-color: var(--az-orange); color: #fff; }
  .size-btn.active {
    background: var(--az-orange);
    border-color: var(--az-orange);
    color: var(--az-navy);
    font-weight: 700;
  }

  /* ---- 集計バー（Amazon の二段目ナビ） ---- */

  .stats-bar {
    display: flex;
    gap: 26px;
    align-items: baseline;
    padding: 8px 18px;
    background: var(--az-navy2);
  }

  .stat { display: flex; align-items: baseline; gap: 5px; }
  .stat-num { font-size: 15px; font-weight: 700; color: #fff; }
  .stat-label { font-size: 11px; color: #CCC; }

  /* ---- 新規追加フォーム（白いカード） ---- */

  .form-area {
    margin: 14px 14px 0;
    padding: 14px 16px 16px;
    background: #fff;
    border: 1px solid var(--az-line);
    border-radius: 8px;
  }

  .form-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--az-text);
    margin-bottom: 12px;
  }

  .form-grid { display: grid; grid-template-columns: 150px 1fr 130px; gap: 12px; align-items: end; }
  .form-row2 { display: grid; grid-template-columns: 1fr 1fr 100px; gap: 12px; margin-top: 12px; align-items: end; }

  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; font-weight: 700; color: var(--az-text); }

  .field input, .field select {
    border: 1px solid #888C8C;
    border-radius: 4px;
    background: #fff;
    padding: 7px 9px;
    font-size: 14px;
    font-family: inherit;
    color: var(--az-text);
    outline: none;
    width: 100%;
    box-shadow: 0 1px 2px rgba(15,17,17,.08) inset;
    transition: border-color .1s, box-shadow .1s;
  }
  .field input:focus, .field select:focus {
    border-color: #007185;
    box-shadow: 0 0 0 3px #C8F3FA;
  }

  /* Amazon の黄色いボタン */
  .add-btn {
    background: var(--az-yellow);
    color: var(--az-text);
    border: 1px solid var(--az-yellow-br);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    height: 36px;
    box-shadow: 0 2px 5px rgba(15,17,17,.15);
    transition: background .1s;
  }
  .add-btn:hover { background: #F7CA00; }
  .add-btn:active { background: #F0B800; box-shadow: none; }

  /* ---- 持ち物セット（テンプレ・お気に入り） ---- */

  .set-area {
    margin: 12px 14px 0;
    padding: 14px 16px 12px;
    background: #fff;
    border: 1px solid var(--az-line);
    border-radius: 8px;
  }

  .set-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  .set-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--az-text);
    width: 66px;
    flex-shrink: 0;
    padding-top: 5px;
  }

  .set-chips { display: flex; gap: 7px; flex-wrap: wrap; flex: 1; min-width: 0; }

  .set-btn {
    font-size: 12px;
    padding: 5px 12px;
    border: 1px solid var(--az-line);
    background: #fff;
    border-radius: 18px;
    cursor: pointer;
    color: var(--az-link);
    font-family: inherit;
    transition: all 0.12s;
    white-space: nowrap;
    box-shadow: 0 1px 2px rgba(15,17,17,.06);
  }
  .set-btn:hover { background: #FFF8E7; border-color: var(--az-orange); color: var(--az-text); }

  /* お気に入りは削除ボタンとひとまとまりに見せる */
  .fav-chip { display: inline-flex; align-items: center; }
  .fav-chip .set-btn { border-radius: 18px 0 0 18px; border-right: none; }
  .fav-del {
    font-size: 12px;
    padding: 5px 9px;
    border: 1px solid var(--az-line);
    border-radius: 0 18px 18px 0;
    background: #fff;
    color: #949494;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.12s;
    box-shadow: 0 1px 2px rgba(15,17,17,.06);
  }
  .fav-del:hover { color: var(--az-price); background: #FDEDED; border-color: var(--az-price); }

  .set-save-btn {
    font-size: 12px;
    padding: 5px 12px;
    border: 1px solid var(--az-yellow-br);
    background: var(--az-yellow);
    border-radius: 18px;
    cursor: pointer;
    color: var(--az-text);
    font-family: inherit;
    white-space: nowrap;
    box-shadow: 0 1px 2px rgba(15,17,17,.1);
    transition: background .1s;
  }
  .set-save-btn:hover { background: #F7CA00; }

  /* 選択中のリスト。Amazon の選択済みタブに寄せる */
  .set-btn.active {
    background: var(--az-navy);
    border-color: var(--az-navy);
    color: #fff;
    font-weight: 700;
  }
  .set-btn.active:hover { background: var(--az-navy); border-color: var(--az-navy); color: #fff; }
  .set-btn.active .set-count { color: #BBB; }

  /* まだ開いていないテンプレは控えめに見せる */
  .set-btn.untouched { border-style: dashed; color: var(--az-sub); }
  .set-btn.untouched:hover { color: var(--az-text); }

  .set-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

  .set-new-btn {
    font-size: 12px;
    padding: 5px 12px;
    border: 1px dashed #B8BDBD;
    background: #fff;
    border-radius: 18px;
    cursor: pointer;
    color: var(--az-link);
    font-family: inherit;
    white-space: nowrap;
    transition: all .12s;
  }
  .set-new-btn:hover { border-color: var(--az-orange); background: #FFF8E7; color: var(--az-text); }

  .set-count { color: var(--az-sub); font-size: 11px; }
  .set-empty { font-size: 12px; color: var(--az-sub); padding-top: 5px; }
  .set-hint { font-size: 11px; color: var(--az-sub); margin-top: 2px; }

  /* ---- 絞込・並び替え ---- */

  .filter-bar, .sort-bar {
    display: flex;
    gap: 7px;
    padding: 12px 16px 0;
    margin: 12px 14px 0;
    align-items: center;
    flex-wrap: wrap;
  }
  .sort-bar { padding-top: 8px; padding-bottom: 4px; }

  .filter-label { font-size: 12px; font-weight: 700; color: var(--az-text); }

  .filter-btn, .sort-btn {
    font-size: 12px;
    padding: 5px 12px;
    border: 1px solid var(--az-line);
    background: #fff;
    border-radius: 18px;
    cursor: pointer;
    color: var(--az-link);
    font-family: inherit;
    transition: all 0.12s;
    white-space: nowrap;
    box-shadow: 0 1px 2px rgba(15,17,17,.06);
  }
  .filter-btn:hover, .sort-btn:hover { background: #F7FAFA; border-color: #B8BDBD; }

  .filter-btn.active, .sort-btn.active {
    background: #EDFDFF;
    border-color: #007185;
    color: #0F1111;
    font-weight: 700;
    box-shadow: 0 0 0 1px #007185 inset;
  }

  .sort-hint { font-size: 11px; color: var(--az-sub); margin-left: 4px; }
  @media (max-width: 700px) { .sort-hint { display: none; } }

  /* ---- 一覧（白いカード） ---- */

  .list-header {
    display: grid;
    grid-template-columns: 40px 96px 2.2fr 96px 110px 1fr 34px 34px;
    gap: 10px;
    padding: 10px 16px;
    margin: 10px 14px 0;
    font-size: 12px;
    font-weight: 700;
    color: var(--az-sub);
    background: #fff;
    border: 1px solid var(--az-line);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
  }

  .list-body {
    min-height: 320px;
    margin: 0 14px;
    background: #fff;
    border: 1px solid var(--az-line);
    border-radius: 0 0 8px 8px;
  }

  .list-item {
    display: grid;
    grid-template-columns: 40px 96px 2.2fr 96px 110px 1fr 34px 34px;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--az-line2);
    align-items: center;
    transition: background 0.1s;
    animation: slideIn 0.18s ease;
  }
  .list-item:last-child { border-bottom: none; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .list-item:hover { background: #F7FAFA; }
  .list-item.bought { background: #FAFAFA; }
  .list-item.bought .item-name { text-decoration: line-through; color: #8B8B8B; }

  .check-box {
    width: 18px; height: 18px;
    border: 1px solid #888C8C;
    border-radius: 3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    transition: all 0.12s;
    color: transparent;
    background: #fff;
    box-shadow: 0 1px 2px rgba(15,17,17,.08) inset;
    flex-shrink: 0;
  }
  .check-box:hover { border-color: #007185; box-shadow: 0 0 0 3px #C8F3FA; }
  .check-box.checked {
    background: #007185;
    border-color: #007185;
    color: #fff;
  }

  .item-date { font-size: 12px; color: var(--az-sub); }

  .item-name {
    font-size: 14px;
    color: var(--az-link);
    line-height: 1.4;
    cursor: pointer;
  }
  .item-name:hover { color: var(--az-link-h); text-decoration: underline; }

  .item-cat { font-size: 12px; }

  /* Amazon の価格表示（赤・太字） */
  .item-price {
    font-size: 17px;
    color: var(--az-price);
    font-weight: 400;
    text-align: right;
    letter-spacing: -0.2px;
  }
  .list-item.bought .item-price { color: #8B8B8B; }

  .item-memo { font-size: 12px; color: var(--az-sub); line-height: 1.4; }

  .edit-btn, .del-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #949494;
    font-size: 14px;
    padding: 4px;
    border-radius: 4px;
    transition: all 0.12s;
    text-align: center;
    font-family: inherit;
  }
  .edit-btn:hover { color: var(--az-link); background: #EDFDFF; }
  .del-btn:hover { color: var(--az-price); background: #FDEDED; }

  /* ---- 編集中の行 ---- */

  .list-item.editing {
    background: #FFF8E7;
    box-shadow: inset 3px 0 0 var(--az-orange);
  }

  .edit-input {
    border: 1px solid #888C8C;
    border-radius: 4px;
    background: #fff;
    padding: 5px 7px;
    font-size: 13px;
    font-family: inherit;
    color: var(--az-text);
    outline: none;
    width: 100%;
    min-width: 0;
  }
  .edit-input:focus { border-color: #007185; box-shadow: 0 0 0 3px #C8F3FA; }
  .edit-input.price { text-align: right; }

  /* ---- カテゴリのタグ ---- */

  .cat-tag {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
  }

  .empty-msg {
    text-align: center;
    padding: 60px 20px;
    color: var(--az-sub);
    font-size: 14px;
  }

  /* ---- 合計 ---- */

  .total-row {
    display: flex;
    justify-content: flex-end;
    align-items: baseline;
    gap: 12px;
    padding: 14px 18px;
    margin: 12px 14px 0;
    background: #fff;
    border: 1px solid var(--az-line);
    border-radius: 8px;
  }

  .total-label { font-size: 14px; color: var(--az-text); }
  .total-amount { font-size: 24px; font-weight: 700; color: var(--az-price); letter-spacing: -0.4px; }

  /* ---- カテゴリの色 ---- */

  .cat-食料品   { background:#FFF0E0; color:#B45309; }
  .cat-日用品   { background:#E6F4EA; color:#1E7A47; }
  .cat-衣類     { background:#EDE9FE; color:#5B2AAA; }
  .cat-電化製品 { background:#E0F2FE; color:#0A5FA8; }
  .cat-趣味     { background:#FEF3C7; color:#8A6100; }
  .cat-その他   { background:#EFEFEF; color:#565959; }

  /* ---- 狭い画面 ---- */

  @media (max-width: 700px) {
    .size-ctrl { align-items: flex-start; width: 100%; }
    .size-row { flex-wrap: wrap; }
    .form-grid { grid-template-columns: 1fr 1fr; }
    .form-row2 { grid-template-columns: 1fr 1fr; }

    .list-header, .list-item {
      grid-template-columns: 30px 1fr 84px 30px 30px;
    }
    .list-header span:nth-child(2),
    .list-header span:nth-child(4),
    .list-header span:nth-child(6),
    .list-item .item-date,
    .list-item .item-cat,
    .list-item .item-memo { display: none; }

    /* 編集中は全項目を編集できるよう2列で展開 */
    .list-item.editing { grid-template-columns: 1fr 1fr; }
    .list-item.editing #edit-name,
    .list-item.editing #edit-memo { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div class="notebook">
  <div class="header">
    <div>
      <h1>持ち物・購入リスト</h1>
      <p>ITEM &amp; PURCHASE RECORD</p>
    </div>
    <div class="size-ctrl">
      <div class="size-row" id="width-row">
        <span>幅</span>
        <button class="size-btn" onclick="setWidth('560px',this)">狭</button>
        <button class="size-btn active" onclick="setWidth('720px',this)">標準</button>
        <button class="size-btn" onclick="setWidth('960px',this)">広</button>
        <button class="size-btn" onclick="setWidth('100%',this)">全幅</button>
      </div>
      <div class="size-row" id="zoom-row">
        <span>文字</span>
        <button class="size-btn" onclick="setZoom('0.85',this)">小</button>
        <button class="size-btn active" onclick="setZoom('1',this)">標準</button>
        <button class="size-btn" onclick="setZoom('1.2',this)">大</button>
        <button class="size-btn" onclick="setZoom('1.45',this)">特大</button>
      </div>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat">
      <span class="stat-num" id="total-count">0</span>
      <span class="stat-label">総件数</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="bought-count">0</span>
      <span class="stat-label">購入済</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="total-amount">¥0</span>
      <span class="stat-label">合計金額</span>
    </div>
  </div>

  <div class="form-area">
    <div class="form-title">＋ 新規追加</div>
    <div class="form-grid">
      <div class="field">
        <label>購入日</label>
        <input type="date" id="inp-date">
      </div>
      <div class="field">
        <label>品目名</label>
        <input type="text" id="inp-name" placeholder="例：ワイヤレスイヤホン">
      </div>
      <div class="field">
        <label>金額（円）</label>
        <input type="text" inputmode="numeric" id="inp-price" placeholder="0">
      </div>
    </div>
    <div class="form-row2">
      <div class="field">
        <label>カテゴリ</label>
        <select id="inp-cat">
          <option>食料品</option>
          <option>日用品</option>
          <option>衣類</option>
          <option>電化製品</option>
          <option>趣味</option>
          <option>その他</option>
        </select>
      </div>
      <div class="field">
        <label>メモ</label>
        <input type="text" id="inp-memo" placeholder="備考など">
      </div>
      <button class="add-btn" onclick="addItem()">追加</button>
    </div>
  </div>

  <div class="set-area">
    <div class="set-row">
      <span class="set-label">リスト</span>
      <div class="set-chips" id="list-tabs"></div>
    </div>
    <div class="set-actions">
      <button class="set-save-btn" onclick="duplicateList()">このリストを複製</button>
      <button class="set-new-btn" onclick="createList()">＋ 新しいリスト</button>
      <span class="set-hint" id="list-hint"></span>
    </div>
  </div>

  <div class="filter-bar">
    <span class="filter-label">絞込：</span>
    <button class="filter-btn active" onclick="setFilter('全て',this)">全て</button>
    <button class="filter-btn" onclick="setFilter('未購入',this)">未購入</button>
    <button class="filter-btn" onclick="setFilter('購入済',this)">購入済</button>
    <button class="filter-btn" onclick="setFilter('食料品',this)">食料品</button>
    <button class="filter-btn" onclick="setFilter('日用品',this)">日用品</button>
    <button class="filter-btn" onclick="setFilter('衣類',this)">衣類</button>
    <button class="filter-btn" onclick="setFilter('電化製品',this)">電化製品</button>
    <button class="filter-btn" onclick="setFilter('趣味',this)">趣味</button>
    <button class="filter-btn" onclick="setFilter('その他',this)">その他</button>
  </div>

  <div class="sort-bar">
    <span class="filter-label">並び：</span>
    <button class="sort-btn active" id="sort-created" onclick="setSort('created')">登録順</button>
    <button class="sort-btn" id="sort-date" onclick="setSort('date')">購入日</button>
    <button class="sort-btn" id="sort-price" onclick="setSort('price')">金額</button>
    <span class="sort-hint">同じ項目をもう一度押すと昇順・降順が入れ替わります</span>
  </div>

  <div class="list-header">
    <span></span>
    <span>購入日</span>
    <span>品目</span>
    <span>カテゴリ</span>
    <span style="text-align:right">金額</span>
    <span>メモ</span>
    <span></span>
    <span></span>
  </div>

  <div class="list-body" id="list-body">
    <div class="empty-msg">まだ登録されていません。上のフォームから追加してください。</div>
  </div>

  <div class="total-row">
    <span class="total-label">表示中の合計</span>
    <span class="total-amount" id="filtered-total">¥0</span>
  </div>
</div>

<script>
  let items = [];
  let currentFilter = '全て';
  let sortKey = 'created';   // created | date | price
  let sortDir = 'desc';      // desc | asc
  let nextId = 1;
  let editingId = null;

  const CATEGORIES = ['食料品','日用品','衣類','電化製品','趣味','その他'];

  /* ---- 持ち物セットのテンプレ ----

  /* 金額の読み取り。全角数字やカンマ、円記号が混ざっても拾う。
     日本語入力だと「１２３４」のように全角で入りやすく、
     素の parseInt では 0 になって黙って消えてしまうため。 */
  function parsePrice(text) {
    const half = String(text).replace(/[０-９]/g, c =>
      String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
    const digits = half.replace(/[^0-9]/g, '');
    return digits ? parseInt(digits, 10) : 0;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }

  /* ---- 保存（このブラウザ内に記録が残る） ---- */

  const STORE_KEY = 'nb-items';
  const NEXT_ID_KEY = 'nb-next-id';
  const SORT_KEY = 'nb-sort-key';
  const SORT_DIR_KEY = 'nb-sort-dir';

  function loadSort() {
    try {
      const k = localStorage.getItem(SORT_KEY);
      const d = localStorage.getItem(SORT_DIR_KEY);
      if (k === 'created' || k === 'date' || k === 'price') sortKey = k;
      if (d === 'asc' || d === 'desc') sortDir = d;
    } catch (e) { /* 読めなければ既定のまま */ }
  }

  function saveItems() {
    try {
      if (currentList === DEFAULT_LIST) {
        // マイリストは従来どおりの保存先。取り込みリンクもここを見る
        localStorage.setItem(STORE_KEY, JSON.stringify(items));
        localStorage.setItem(NEXT_ID_KEY, String(nextId));
      } else {
        const lists = loadLists();
        lists[currentList] = items;
        localStorage.setItem(LISTS_KEY, JSON.stringify(lists));
      }
    } catch (e) {
      // 保存領域がいっぱい、またはプライベートモードで書き込めない場合
      console.warn('記録を保存できませんでした', e);
    }
  }

  /* ---- リストの切り替え ----
     マイリストは STORE_KEY、それ以外は LISTS_KEY にまとめて置く。
     テンプレは初めて開いたときに中身を作る。 */

  const DEFAULT_LIST = 'マイリスト';
  const LISTS_KEY    = 'nb-lists';
  const CURRENT_KEY  = 'nb-current';

  let currentList = DEFAULT_LIST;

  function loadLists() {
    try {
      const o = JSON.parse(localStorage.getItem(LISTS_KEY) || '{}');
      return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
    } catch (e) { return {}; }
  }

  function storeLists(lists) {
    try { localStorage.setItem(LISTS_KEY, JSON.stringify(lists)); }
    catch (e) { alert('リストを保存できませんでした。'); }
  }

  // 保存形式のばらつきを吸収して items に入る形へ揃える
  function normalize(parsed) {
    if (!Array.isArray(parsed)) return [];
    const list = parsed
      .filter(i => i && typeof i === 'object' && typeof i.name === 'string' && i.name !== '')
      .map(i => ({
        id: Number(i.id) || 0,
        name: i.name,
        date: typeof i.date === 'string' ? i.date : '',
        price: Number(i.price) || 0,
        cat: CATEGORIES.includes(i.cat) ? i.cat : 'その他',
        memo: typeof i.memo === 'string' ? i.memo : '',
        bought: i.bought === true
      }));
    let maxId = 0;
    const seen = new Set();
    list.forEach(i => {
      if (i.id <= 0 || seen.has(i.id)) i.id = ++maxId;
      seen.add(i.id);
      if (i.id > maxId) maxId = i.id;
    });
    return list;
  }

  function nextIdFor(list) {
    return list.reduce((m, i) => Math.max(m, i.id), 0) + 1;
  }

  function switchList(name) {
    currentList = name;
    try { localStorage.setItem(CURRENT_KEY, name); } catch (e) {}

    if (name === DEFAULT_LIST) {
      loadItems();
    } else {
      const lists = loadLists();
      if (lists[name]) {
        items = normalize(lists[name]);
      } else if (TEMPLATES[name]) {
        // テンプレは初回だけ中身を作る。以降は編集した状態が残る
        let id = 1;
        items = TEMPLATES[name].map(([n, c, m]) => ({
          id: id++, name: n, date: '', price: 0,
          cat: CATEGORIES.includes(c) ? c : 'その他', memo: m || '', bought: false
        }));
        lists[name] = items;
        storeLists(lists);
      } else {
        items = [];
      }
      nextId = nextIdFor(items);
    }
    editingId = null;
    renderSets();
    render();
  }

  function createList() {
    const name = (prompt('新しいリストの名前を入力してください。', '') || '').trim();
    if (!name) return;
    if (name === DEFAULT_LIST || TEMPLATES[name]) {
      alert(`「${name}」はすでにあります。別の名前にしてください。`);
      return;
    }
    const lists = loadLists();
    if (lists[name] && !confirm(`「${name}」はすでにあります。開きますか？`)) return;
    if (!lists[name]) { lists[name] = []; storeLists(lists); }
    switchList(name);
  }

  function duplicateList() {
    const name = (prompt(`「${currentList}」の内容で新しいリストを作ります。名前を入力してください。`, '') || '').trim();
    if (!name) return;
    if (name === DEFAULT_LIST) { alert('その名前は使えません。'); return; }
    const lists = loadLists();
    if (lists[name] && !confirm(`「${name}」を上書きしますか？`)) return;
    // 金額と購入日は引き継がない（使い回す前提のため）
    lists[name] = items.map((i, n) => ({
      id: n + 1, name: i.name, date: '', price: 0, cat: i.cat, memo: i.memo, bought: false
    }));
    storeLists(lists);
    switchList(name);
  }

  function deleteList(name) {
    if (name === DEFAULT_LIST) return;
    if (!confirm(`リスト「${name}」を削除しますか？\nこのリストの品目は消えます（マイリストには影響しません）。`)) return;
    const lists = loadLists();
    delete lists[name];
    storeLists(lists);
    if (currentList === name) switchList(DEFAULT_LIST);
    else { renderSets(); render(); }
  }

  function loadItems() {
    let raw;
    try {
      raw = localStorage.getItem(STORE_KEY);
    } catch (e) {
      return;
    }
    if (!raw) return;

    let parsed;
    try {
      parsed = JSON.parse(raw);
    } catch (e) {
      console.warn('保存データを読めませんでした', e);
      return;
    }
    if (!Array.isArray(parsed)) return;

    items = normalize(parsed);

    // 保存済みの採番があればそちらを優先（削除済みidの再利用を避ける）
    const stored = parseInt(localStorage.getItem(NEXT_ID_KEY), 10);
    nextId = Math.max(stored > 0 ? stored : 0, nextIdFor(items));
  }

  document.getElementById('inp-date').value = new Date().toISOString().slice(0,10);

  function activate(rowId, btn) {
    document.querySelectorAll('#' + rowId + ' .size-btn')
      .forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function setWidth(w, btn) {
    document.documentElement.style.setProperty('--nb-width', w);
    localStorage.setItem('nb-width', w);
    activate('width-row', btn);
  }

  function setZoom(z, btn) {
    document.documentElement.style.setProperty('--nb-zoom', z);
    localStorage.setItem('nb-zoom', z);
    activate('zoom-row', btn);
  }

  function restoreSize() {
    const w = localStorage.getItem('nb-width');
    const z = localStorage.getItem('nb-zoom');
    if (w) {
      const btn = [...document.querySelectorAll('#width-row .size-btn')]
        .find(b => b.getAttribute('onclick').includes("'" + w + "'"));
      if (btn) setWidth(w, btn);
    }
    if (z) {
      const btn = [...document.querySelectorAll('#zoom-row .size-btn')]
        .find(b => b.getAttribute('onclick').includes("'" + z + "'"));
      if (btn) setZoom(z, btn);
    }
  }

  restoreSize();

  function addItem() {
    const name  = document.getElementById('inp-name').value.trim();
    const date  = document.getElementById('inp-date').value;
    const price = parsePrice(document.getElementById('inp-price').value);
    const cat   = document.getElementById('inp-cat').value;
    const memo  = document.getElementById('inp-memo').value.trim();
    if (!name) { document.getElementById('inp-name').focus(); return; }
    items.unshift({ id: nextId++, name, date, price, cat, memo, bought: false });
    document.getElementById('inp-name').value = '';
    document.getElementById('inp-price').value = '';
    document.getElementById('inp-memo').value = '';
    saveItems();
    render();
  }

  function toggleBought(id) {
    const item = items.find(i => i.id === id);
    if (item) item.bought = !item.bought;
    saveItems();
    render();
  }

  function deleteItem(id) {
    items = items.filter(i => i.id !== id);
    if (editingId === id) editingId = null;
    saveItems();
    render();
  }

  function startEdit(id) {
    editingId = id;
    render();
    const f = document.getElementById('edit-name');
    if (f) { f.focus(); f.select(); }
  }

  function cancelEdit() {
    editingId = null;
    render();
  }

  function saveEdit(id) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    const name = document.getElementById('edit-name').value.trim();
    if (!name) { document.getElementById('edit-name').focus(); return; }
    item.name  = name;
    item.date  = document.getElementById('edit-date').value;
    item.price = parsePrice(document.getElementById('edit-price').value);
    item.cat   = document.getElementById('edit-cat').value;
    item.memo  = document.getElementById('edit-memo').value.trim();
    editingId = null;
    saveItems();
    render();
  }

  function editKey(e, id) {
    if (e.key === 'Enter') saveEdit(id);
    if (e.key === 'Escape') cancelEdit();
  }

  function renderSets() {
    const lists = loadLists();
    // マイリスト → テンプレ → 自作リスト の順に並べる
    const names = [DEFAULT_LIST, ...Object.keys(TEMPLATES),
                   ...Object.keys(lists).filter(n => !TEMPLATES[n] && n !== DEFAULT_LIST)];

    const count = n => {
      if (n === DEFAULT_LIST) return null;              // マイリストは件数を出さない
      if (lists[n]) return lists[n].length;
      if (TEMPLATES[n]) return TEMPLATES[n].length;     // まだ開いていないテンプレ
      return 0;
    };

    document.getElementById('list-tabs').innerHTML = names.map(n => {
      const j = JSON.stringify(n).replace(/"/g, '&quot;');
      const on = n === currentList;
      const c = count(n);
      const untouched = n !== DEFAULT_LIST && !lists[n];
      const chip = `<button class="set-btn${on ? ' active' : ''}${untouched ? ' untouched' : ''}" `
        + `onclick="switchList(${j})">${esc(n)}`
        + (c === null ? '' : `<span class="set-count"> ${c}</span>`)
        + `</button>`;
      // 消せるのは自分で作った／開いたリストだけ
      return (n === DEFAULT_LIST || untouched)
        ? chip
        : `<span class="fav-chip">${chip}<button class="fav-del" onclick="deleteList(${j})" title="削除">✕</button></span>`;
    }).join('');

    document.getElementById('list-hint').textContent =
      currentList === DEFAULT_LIST
        ? '購入の記録用リストです。テンプレを押すと別のリストに切り替わります。'
        : `「${currentList}」を表示中。チェックや編集はこのリストにだけ保存されます。`;
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function filtered() {
    if (currentFilter === '全て') return items;
    if (currentFilter === '未購入') return items.filter(i => !i.bought);
    if (currentFilter === '購入済') return items.filter(i => i.bought);
    return items.filter(i => i.cat === currentFilter);
  }

  /* ---- 並び替え ---- */

  // 同じ項目を押し直したら昇順・降順を入れ替える。
  function setSort(key) {
    if (sortKey === key) {
      sortDir = sortDir === 'desc' ? 'asc' : 'desc';
    } else {
      sortKey = key;
      // 登録順と購入日は「新しい順」、金額は「高い順」から始めるのが自然
      sortDir = 'desc';
    }
    try {
      localStorage.setItem(SORT_KEY, sortKey);
      localStorage.setItem(SORT_DIR_KEY, sortDir);
    } catch (e) { /* 保存できなくても並び替え自体は動く */ }
    render();
  }

  function applySortLabels() {
    const arrow = sortDir === 'desc' ? ' ▼' : ' ▲';
    const labels = { created: '登録順', date: '購入日', price: '金額' };
    ['created','date','price'].forEach(k => {
      const b = document.getElementById('sort-' + k);
      if (!b) return;
      const on = k === sortKey;
      b.classList.toggle('active', on);
      b.textContent = labels[k] + (on ? arrow : '');
    });
  }

  function sorted(list) {
    // 元配列は登録順（新しいものが先頭）なので、それを基準に組み立てる
    if (sortKey === 'created') {
      return sortDir === 'desc' ? list : list.slice().reverse();
    }

    // sort は安定なので、同値のときは元の並び（登録順）が保たれる
    const sign = sortDir === 'desc' ? -1 : 1;
    return list.slice().sort((a, b) => {
      if (sortKey === 'price') return (a.price - b.price) * sign;
      // 購入日。未入力は昇順・降順どちらでも末尾へ送る
      if (!a.date && !b.date) return 0;
      if (!a.date) return 1;
      if (!b.date) return -1;
      return (a.date < b.date ? -1 : a.date > b.date ? 1 : 0) * sign;
    });
  }

  function fmtDate(d) {
    if (!d) return '—';
    const [y,m,day] = d.split('-');
    return `${y}/${m}/${day}`;
  }

  function fmtPrice(p) {
    return p ? '¥' + p.toLocaleString() : '—';
  }

  function viewRow(item) {
    return `
      <div class="list-item ${item.bought ? 'bought' : ''}">
        <div class="check-box ${item.bought ? 'checked' : ''}" onclick="toggleBought(${item.id})">✓</div>
        <span class="item-date">${fmtDate(item.date)}</span>
        <span class="item-name">${esc(item.name)}</span>
        <span class="item-cat"><span class="cat-tag cat-${esc(item.cat)}">${esc(item.cat)}</span></span>
        <span class="item-price">${fmtPrice(item.price)}</span>
        <span class="item-memo">${item.memo ? esc(item.memo) : '—'}</span>
        <button class="edit-btn" onclick="startEdit(${item.id})" title="編集">✎</button>
        <button class="del-btn" onclick="deleteItem(${item.id})" title="削除">✕</button>
      </div>
    `;
  }

  function editRow(item) {
    const opts = CATEGORIES.map(c =>
      `<option${c === item.cat ? ' selected' : ''}>${c}</option>`
    ).join('');
    return `
      <div class="list-item editing" onkeydown="editKey(event, ${item.id})">
        <div class="check-box ${item.bought ? 'checked' : ''}" onclick="toggleBought(${item.id})">✓</div>
        <input class="edit-input" id="edit-date" type="date" value="${esc(item.date)}">
        <input class="edit-input" id="edit-name" type="text" value="${esc(item.name)}" placeholder="品目名">
        <select class="edit-input" id="edit-cat">${opts}</select>
        <input class="edit-input price" id="edit-price" type="text" inputmode="numeric" value="${item.price || ''}" placeholder="0">
        <input class="edit-input" id="edit-memo" type="text" value="${esc(item.memo)}" placeholder="メモ">
        <button class="edit-btn save-btn" onclick="saveEdit(${item.id})" title="保存">✓</button>
        <button class="del-btn" onclick="cancelEdit()" title="キャンセル">✕</button>
      </div>
    `;
  }

  function render() {
    const list = sorted(filtered());
    applySortLabels();
    const body = document.getElementById('list-body');
    document.getElementById('total-count').textContent = items.length;
    document.getElementById('bought-count').textContent = items.filter(i=>i.bought).length;
    const totalAmt = items.filter(i=>i.bought).reduce((s,i)=>s+i.price,0);
    document.getElementById('total-amount').textContent = '¥' + totalAmt.toLocaleString();
    const filteredAmt = list.reduce((s,i)=>s+i.price,0);
    document.getElementById('filtered-total').textContent = '¥' + filteredAmt.toLocaleString();

    if (list.length === 0) {
      body.innerHTML = '<div class="empty-msg">該当する項目がありません。</div>';
      return;
    }

    body.innerHTML = list.map(item =>
      item.id === editingId ? editRow(item) : viewRow(item)
    ).join('');
  }

  /* ---- リンクからの取り込み（#import=... ） ----
     他端末や旧バージョンからデータを移すための入口。
     現在の内容を置き換えるため、必ず確認を挟む。 */
  function importFromHash() {
    const m = location.hash.match(/^#import=(.+)$/);
    if (!m) return false;

    // 取り込みの成否にかかわらず、URLから読み込み用の文字列は消す
    const clearHash = () =>
      history.replaceState(null, '', location.pathname + location.search);

    let incoming;
    try {
      let b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';   // 末尾のパディングが欠けていても読めるように
      const bin = atob(b64);
      const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
      incoming = JSON.parse(new TextDecoder().decode(bytes));
    } catch (e) {
      clearHash();
      alert('取り込み用のデータを読み取れませんでした。');
      return false;
    }
    if (!Array.isArray(incoming) || incoming.length === 0) {
      clearHash();
      return false;
    }

    const existing = (() => {
      try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]').length; }
      catch (e) { return 0; }
    })();

    const msg = existing > 0
      ? `${incoming.length}件を取り込みます。\n現在保存されている${existing}件は置き換えられます。よろしいですか？`
      : `${incoming.length}件を取り込みます。よろしいですか？`;

    if (!confirm(msg)) { clearHash(); return false; }

    localStorage.setItem(STORE_KEY, JSON.stringify(incoming));
    localStorage.removeItem(NEXT_ID_KEY);
    clearHash();
    return true;
  }

  importFromHash();
  loadSort();

  // 前回開いていたリストを復元する（消えていればマイリストへ）
  let startList = DEFAULT_LIST;
  try {
    const saved = localStorage.getItem(CURRENT_KEY);
    if (saved && (saved === DEFAULT_LIST || TEMPLATES[saved] || loadLists()[saved])) startList = saved;
  } catch (e) {}
  switchList(startList);
</script>
</body>
</html>
