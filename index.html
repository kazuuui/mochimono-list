<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>持ち物・購入リスト</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --nb-width: 720px;
    --nb-zoom: 1;
  }

  body {
    background: #f0ece4;
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 48px;
    background-image: repeating-linear-gradient(
      transparent, transparent 31px, #ddd5c8 31px, #ddd5c8 32px
    );
  }

  .notebook {
    max-width: var(--nb-width);
    zoom: var(--nb-zoom);
    margin: 0 auto;
    background: #fdfaf5;
    border-radius: 4px;
    box-shadow: 3px 4px 24px rgba(0,0,0,0.18), -1px 0 0 #e8e0d4;
    overflow: hidden;
    position: relative;
  }

  .notebook::before {
    content: '';
    position: absolute;
    left: 40px;
    top: 0; bottom: 0;
    width: 1px;
    background: #e0c8b0;
    z-index: 1;
  }

  .header {
    background: #1a2744;
    padding: 12px 20px 12px 56px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .header h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 17px;
    color: #f5e6c8;
    letter-spacing: 0.06em;
    font-weight: 700;
    line-height: 1.3;
  }

  .header p {
    font-size: 9px;
    color: #8a9abc;
    margin-top: 1px;
    letter-spacing: 0.12em;
  }

  .size-ctrl {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-end;
  }

  .size-row { display: flex; align-items: center; gap: 6px; }

  .size-row > span {
    font-size: 10px;
    color: #8a9abc;
    letter-spacing: 0.1em;
    margin-right: 2px;
  }

  .size-btn {
    font-size: 10px;
    padding: 3px 8px;
    border: 1px solid #3a4a6c;
    background: transparent;
    border-radius: 20px;
    cursor: pointer;
    color: #8a9abc;
    font-family: 'Noto Sans JP', sans-serif;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .size-btn:hover { border-color: #c9971e; color: #f5d87a; }
  .size-btn.active {
    background: #c9971e;
    border-color: #c9971e;
    color: #1a2744;
    font-weight: 500;
  }

  .stats-bar {
    display: flex;
    gap: 22px;
    align-items: baseline;
    padding: 7px 20px 7px 56px;
    background: #232f52;
    border-bottom: 2px solid #c9971e;
  }

  .stat { display: flex; align-items: baseline; gap: 5px; }
  .stat-num {
    font-size: 15px;
    font-weight: 700;
    color: #f5d87a;
    font-family: 'Noto Serif JP', serif;
  }
  .stat-label {
    font-size: 9px;
    color: #8a9abc;
    letter-spacing: 0.08em;
  }

  .form-area {
    padding: 12px 20px 12px 56px;
    border-bottom: 1px solid #e8ddd0;
    background: #fef9f0;
  }

  .form-title {
    font-size: 10px;
    color: #8a7a66;
    letter-spacing: 0.15em;
    margin-bottom: 8px;
    font-weight: 500;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 120px 1fr 100px;
    gap: 10px;
    align-items: end;
  }

  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 10px; color: #9a8a76; letter-spacing: 0.1em; }
  .field input, .field select {
    border: none;
    border-bottom: 1.5px solid #c8b89a;
    background: transparent;
    padding: 6px 2px;
    font-size: 13px;
    font-family: 'Noto Sans JP', sans-serif;
    color: #2a1f14;
    outline: none;
    width: 100%;
    transition: border-color 0.2s;
  }
  .field input:focus, .field select:focus { border-bottom-color: #c9971e; }

  .form-row2 {
    display: grid;
    grid-template-columns: 1fr 1fr 80px;
    gap: 10px;
    margin-top: 10px;
    align-items: end;
  }

  .add-btn {
    background: #1a2744;
    color: #f5e6c8;
    border: none;
    padding: 8px 16px;
    border-radius: 2px;
    font-size: 12px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: background 0.2s;
    height: 36px;
  }
  .add-btn:hover { background: #c9971e; color: #1a2744; }

  .filter-bar {
    display: flex;
    gap: 6px;
    padding: 8px 20px 8px 56px;
    border-bottom: 1px solid #e8ddd0;
    align-items: center;
    flex-wrap: wrap;
  }

  .filter-label { font-size: 10px; color: #9a8a76; }

  .filter-btn {
    font-size: 11px;
    padding: 3px 10px;
    border: 1px solid #c8b89a;
    background: transparent;
    border-radius: 20px;
    cursor: pointer;
    color: #6a5a4a;
    font-family: 'Noto Sans JP', sans-serif;
    transition: all 0.15s;
  }
  .filter-btn.active { background: #1a2744; color: #f5e6c8; border-color: #1a2744; }

  .list-header {
    display: grid;
    grid-template-columns: 36px 90px 1fr 90px 80px 90px 28px 28px;
    gap: 8px;
    padding: 8px 16px 8px 56px;
    font-size: 10px;
    color: #9a8a76;
    letter-spacing: 0.1em;
    border-bottom: 1.5px solid #c9971e;
    background: #fef9f0;
  }

  .list-body { min-height: 340px; }

  .list-item {
    display: grid;
    grid-template-columns: 36px 90px 1fr 90px 80px 90px 28px 28px;
    gap: 8px;
    padding: 10px 16px 10px 56px;
    border-bottom: 1px solid #ece4d8;
    align-items: center;
    transition: background 0.15s;
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .list-item:hover { background: #fef5e4; }
  .list-item.bought { opacity: 0.55; }
  .list-item.bought .item-name { text-decoration: line-through; color: #9a8a76; }

  .check-box {
    width: 22px; height: 22px;
    border: 1.5px solid #c8b89a;
    border-radius: 2px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.15s;
    color: transparent;
    background: white;
    flex-shrink: 0;
  }
  .check-box:hover { border-color: #c9971e; }
  .check-box.checked {
    background: #1a2744;
    border-color: #1a2744;
    color: #f5d87a;
    animation: stamp 0.2s ease;
  }

  @keyframes stamp {
    0%   { transform: scale(1.4); }
    60%  { transform: scale(0.9); }
    100% { transform: scale(1); }
  }

  .item-date { font-size: 11px; color: #9a8a76; }
  .item-name { font-size: 13px; color: #2a1f14; font-weight: 500; }
  .item-cat  { font-size: 11px; }
  .item-price {
    font-size: 13px;
    color: #1a2744;
    font-weight: 700;
    text-align: right;
    font-family: 'Noto Serif JP', serif;
  }
  .item-memo { font-size: 11px; color: #7a6a5a; }

  .del-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #c8b89a;
    font-size: 14px;
    padding: 2px;
    transition: color 0.15s;
    text-align: center;
  }
  .del-btn:hover { color: #c0392b; }

  .edit-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #c8b89a;
    font-size: 13px;
    padding: 2px;
    transition: color 0.15s;
    text-align: center;
  }
  .edit-btn:hover { color: #1a4aaa; }

  .save-btn:hover { color: #1a7a4a; }

  .list-item.editing {
    background: #fef5e4;
    box-shadow: inset 3px 0 0 #c9971e;
  }

  .edit-input {
    border: none;
    border-bottom: 1.5px solid #c8b89a;
    background: #fdfaf5;
    padding: 3px 4px;
    font-size: 12px;
    font-family: 'Noto Sans JP', sans-serif;
    color: #2a1f14;
    outline: none;
    width: 100%;
    min-width: 0;
    border-radius: 2px 2px 0 0;
  }
  .edit-input:focus { border-bottom-color: #c9971e; background: #fff; }
  .edit-input.price { text-align: right; }

  .cat-tag {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 2px;
    font-size: 10px;
    font-weight: 500;
  }

  .empty-msg {
    text-align: center;
    padding: 40px;
    color: #b0a090;
    font-size: 13px;
    font-style: italic;
  }

  .total-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 12px;
    padding: 9px 20px 9px 56px;
    border-top: 1.5px solid #c9971e;
    background: #fef9f0;
  }

  .total-label { font-size: 12px; color: #6a5a4a; letter-spacing: 0.1em; }
  .total-amount {
    font-size: 20px;
    font-weight: 700;
    color: #1a2744;
    font-family: 'Noto Serif JP', serif;
  }

  .cat-食料品   { background:#fde8d8; color:#c0541a; }
  .cat-日用品   { background:#dff0e8; color:#1a7a4a; }
  .cat-衣類     { background:#e8e0f8; color:#5a2aaa; }
  .cat-電化製品 { background:#ddeeff; color:#1a4aaa; }
  .cat-趣味     { background:#fef0cc; color:#8a6a00; }
  .cat-その他   { background:#ece8e4; color:#5a4a3a; }

  @media (max-width: 600px) {
    .size-ctrl { align-items: flex-start; width: 100%; }
    .size-row { flex-wrap: wrap; }
    .form-grid { grid-template-columns: 1fr 1fr; }
    .form-row2 { grid-template-columns: 1fr 1fr; }
    .list-header, .list-item {
      grid-template-columns: 28px 1fr 60px 24px 24px;
    }
    .list-header span:nth-child(2),
    .list-header span:nth-child(4),
    .list-header span:nth-child(6),
    .list-item .item-date,
    .list-item .item-cat,
    .list-item .item-memo { display: none; }

    /* 編集中は全項目を編集できるよう2列で展開 */
    .list-item.editing { grid-template-columns: 1fr 1fr; }
    .list-item.editing #edit-name,
    .list-item.editing #edit-memo { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div class="notebook">
  <div class="header">
    <div>
      <h1>持ち物・購入リスト</h1>
      <p>ITEM &amp; PURCHASE RECORD</p>
    </div>
    <div class="size-ctrl">
      <div class="size-row" id="width-row">
        <span>幅</span>
        <button class="size-btn" onclick="setWidth('560px',this)">狭</button>
        <button class="size-btn active" onclick="setWidth('720px',this)">標準</button>
        <button class="size-btn" onclick="setWidth('960px',this)">広</button>
        <button class="size-btn" onclick="setWidth('100%',this)">全幅</button>
      </div>
      <div class="size-row" id="zoom-row">
        <span>文字</span>
        <button class="size-btn" onclick="setZoom('0.85',this)">小</button>
        <button class="size-btn active" onclick="setZoom('1',this)">標準</button>
        <button class="size-btn" onclick="setZoom('1.2',this)">大</button>
        <button class="size-btn" onclick="setZoom('1.45',this)">特大</button>
      </div>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat">
      <span class="stat-num" id="total-count">0</span>
      <span class="stat-label">総件数</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="bought-count">0</span>
      <span class="stat-label">購入済</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="total-amount">¥0</span>
      <span class="stat-label">合計金額</span>
    </div>
  </div>

  <div class="form-area">
    <div class="form-title">＋ 新規追加</div>
    <div class="form-grid">
      <div class="field">
        <label>購入日</label>
        <input type="date" id="inp-date">
      </div>
      <div class="field">
        <label>品目名</label>
        <input type="text" id="inp-name" placeholder="例：ワイヤレスイヤホン">
      </div>
      <div class="field">
        <label>金額（円）</label>
        <input type="number" id="inp-price" placeholder="0" min="0">
      </div>
    </div>
    <div class="form-row2">
      <div class="field">
        <label>カテゴリ</label>
        <select id="inp-cat">
          <option>食料品</option>
          <option>日用品</option>
          <option>衣類</option>
          <option>電化製品</option>
          <option>趣味</option>
          <option>その他</option>
        </select>
      </div>
      <div class="field">
        <label>メモ</label>
        <input type="text" id="inp-memo" placeholder="備考など">
      </div>
      <button class="add-btn" onclick="addItem()">追加</button>
    </div>
  </div>

  <div class="filter-bar">
    <span class="filter-label">絞込：</span>
    <button class="filter-btn active" onclick="setFilter('全て',this)">全て</button>
    <button class="filter-btn" onclick="setFilter('未購入',this)">未購入</button>
    <button class="filter-btn" onclick="setFilter('購入済',this)">購入済</button>
    <button class="filter-btn" onclick="setFilter('食料品',this)">食料品</button>
    <button class="filter-btn" onclick="setFilter('日用品',this)">日用品</button>
    <button class="filter-btn" onclick="setFilter('衣類',this)">衣類</button>
    <button class="filter-btn" onclick="setFilter('電化製品',this)">電化製品</button>
    <button class="filter-btn" onclick="setFilter('趣味',this)">趣味</button>
    <button class="filter-btn" onclick="setFilter('その他',this)">その他</button>
  </div>

  <div class="list-header">
    <span></span>
    <span>購入日</span>
    <span>品目</span>
    <span>カテゴリ</span>
    <span style="text-align:right">金額</span>
    <span>メモ</span>
    <span></span>
    <span></span>
  </div>

  <div class="list-body" id="list-body">
    <div class="empty-msg">まだ登録されていません。上のフォームから追加してください。</div>
  </div>

  <div class="total-row">
    <span class="total-label">表示中の合計</span>
    <span class="total-amount" id="filtered-total">¥0</span>
  </div>
</div>

<script>
  let items = [];
  let currentFilter = '全て';
  let nextId = 1;
  let editingId = null;

  const CATEGORIES = ['食料品','日用品','衣類','電化製品','趣味','その他'];

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }

  /* ---- 保存（このブラウザ内に記録が残る） ---- */

  const STORE_KEY = 'nb-items';
  const NEXT_ID_KEY = 'nb-next-id';

  function saveItems() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(items));
      localStorage.setItem(NEXT_ID_KEY, String(nextId));
    } catch (e) {
      // 保存領域がいっぱい、またはプライベートモードで書き込めない場合
      console.warn('記録を保存できませんでした', e);
    }
  }

  function loadItems() {
    let raw;
    try {
      raw = localStorage.getItem(STORE_KEY);
    } catch (e) {
      return;
    }
    if (!raw) return;

    let parsed;
    try {
      parsed = JSON.parse(raw);
    } catch (e) {
      console.warn('保存データを読めませんでした', e);
      return;
    }
    if (!Array.isArray(parsed)) return;

    // 壊れた項目が混ざっていても残りを活かす
    items = parsed
      .filter(i => i && typeof i === 'object' && typeof i.name === 'string' && i.name !== '')
      .map(i => ({
        id: Number(i.id) || 0,
        name: i.name,
        date: typeof i.date === 'string' ? i.date : '',
        price: Number(i.price) || 0,
        cat: CATEGORIES.includes(i.cat) ? i.cat : 'その他',
        memo: typeof i.memo === 'string' ? i.memo : '',
        bought: i.bought === true
      }));

    // id の重複や欠落を直しつつ、次の id を決める
    const stored = parseInt(localStorage.getItem(NEXT_ID_KEY), 10);
    let maxId = 0;
    const seen = new Set();
    items.forEach(i => {
      if (i.id <= 0 || seen.has(i.id)) i.id = ++maxId;
      seen.add(i.id);
      if (i.id > maxId) maxId = i.id;
    });
    nextId = Math.max(stored > 0 ? stored : 0, maxId + 1);
  }

  document.getElementById('inp-date').value = new Date().toISOString().slice(0,10);

  function activate(rowId, btn) {
    document.querySelectorAll('#' + rowId + ' .size-btn')
      .forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function setWidth(w, btn) {
    document.documentElement.style.setProperty('--nb-width', w);
    localStorage.setItem('nb-width', w);
    activate('width-row', btn);
  }

  function setZoom(z, btn) {
    document.documentElement.style.setProperty('--nb-zoom', z);
    localStorage.setItem('nb-zoom', z);
    activate('zoom-row', btn);
  }

  function restoreSize() {
    const w = localStorage.getItem('nb-width');
    const z = localStorage.getItem('nb-zoom');
    if (w) {
      const btn = [...document.querySelectorAll('#width-row .size-btn')]
        .find(b => b.getAttribute('onclick').includes("'" + w + "'"));
      if (btn) setWidth(w, btn);
    }
    if (z) {
      const btn = [...document.querySelectorAll('#zoom-row .size-btn')]
        .find(b => b.getAttribute('onclick').includes("'" + z + "'"));
      if (btn) setZoom(z, btn);
    }
  }

  restoreSize();

  function addItem() {
    const name  = document.getElementById('inp-name').value.trim();
    const date  = document.getElementById('inp-date').value;
    const price = parseInt(document.getElementById('inp-price').value) || 0;
    const cat   = document.getElementById('inp-cat').value;
    const memo  = document.getElementById('inp-memo').value.trim();
    if (!name) { document.getElementById('inp-name').focus(); return; }
    items.unshift({ id: nextId++, name, date, price, cat, memo, bought: false });
    document.getElementById('inp-name').value = '';
    document.getElementById('inp-price').value = '';
    document.getElementById('inp-memo').value = '';
    saveItems();
    render();
  }

  function toggleBought(id) {
    const item = items.find(i => i.id === id);
    if (item) item.bought = !item.bought;
    saveItems();
    render();
  }

  function deleteItem(id) {
    items = items.filter(i => i.id !== id);
    if (editingId === id) editingId = null;
    saveItems();
    render();
  }

  function startEdit(id) {
    editingId = id;
    render();
    const f = document.getElementById('edit-name');
    if (f) { f.focus(); f.select(); }
  }

  function cancelEdit() {
    editingId = null;
    render();
  }

  function saveEdit(id) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    const name = document.getElementById('edit-name').value.trim();
    if (!name) { document.getElementById('edit-name').focus(); return; }
    item.name  = name;
    item.date  = document.getElementById('edit-date').value;
    item.price = parseInt(document.getElementById('edit-price').value) || 0;
    item.cat   = document.getElementById('edit-cat').value;
    item.memo  = document.getElementById('edit-memo').value.trim();
    editingId = null;
    saveItems();
    render();
  }

  function editKey(e, id) {
    if (e.key === 'Enter') saveEdit(id);
    if (e.key === 'Escape') cancelEdit();
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function filtered() {
    if (currentFilter === '全て') return items;
    if (currentFilter === '未購入') return items.filter(i => !i.bought);
    if (currentFilter === '購入済') return items.filter(i => i.bought);
    return items.filter(i => i.cat === currentFilter);
  }

  function fmtDate(d) {
    if (!d) return '—';
    const [y,m,day] = d.split('-');
    return `${y}/${m}/${day}`;
  }

  function fmtPrice(p) {
    return p ? '¥' + p.toLocaleString() : '—';
  }

  function viewRow(item) {
    return `
      <div class="list-item ${item.bought ? 'bought' : ''}">
        <div class="check-box ${item.bought ? 'checked' : ''}" onclick="toggleBought(${item.id})">✓</div>
        <span class="item-date">${fmtDate(item.date)}</span>
        <span class="item-name">${esc(item.name)}</span>
        <span class="item-cat"><span class="cat-tag cat-${esc(item.cat)}">${esc(item.cat)}</span></span>
        <span class="item-price">${fmtPrice(item.price)}</span>
        <span class="item-memo">${item.memo ? esc(item.memo) : '—'}</span>
        <button class="edit-btn" onclick="startEdit(${item.id})" title="編集">✎</button>
        <button class="del-btn" onclick="deleteItem(${item.id})" title="削除">✕</button>
      </div>
    `;
  }

  function editRow(item) {
    const opts = CATEGORIES.map(c =>
      `<option${c === item.cat ? ' selected' : ''}>${c}</option>`
    ).join('');
    return `
      <div class="list-item editing" onkeydown="editKey(event, ${item.id})">
        <div class="check-box ${item.bought ? 'checked' : ''}" onclick="toggleBought(${item.id})">✓</div>
        <input class="edit-input" id="edit-date" type="date" value="${esc(item.date)}">
        <input class="edit-input" id="edit-name" type="text" value="${esc(item.name)}" placeholder="品目名">
        <select class="edit-input" id="edit-cat">${opts}</select>
        <input class="edit-input price" id="edit-price" type="number" min="0" value="${item.price || ''}" placeholder="0">
        <input class="edit-input" id="edit-memo" type="text" value="${esc(item.memo)}" placeholder="メモ">
        <button class="edit-btn save-btn" onclick="saveEdit(${item.id})" title="保存">✓</button>
        <button class="del-btn" onclick="cancelEdit()" title="キャンセル">✕</button>
      </div>
    `;
  }

  function render() {
    const list = filtered();
    const body = document.getElementById('list-body');
    document.getElementById('total-count').textContent = items.length;
    document.getElementById('bought-count').textContent = items.filter(i=>i.bought).length;
    const totalAmt = items.filter(i=>i.bought).reduce((s,i)=>s+i.price,0);
    document.getElementById('total-amount').textContent = '¥' + totalAmt.toLocaleString();
    const filteredAmt = list.reduce((s,i)=>s+i.price,0);
    document.getElementById('filtered-total').textContent = '¥' + filteredAmt.toLocaleString();

    if (list.length === 0) {
      body.innerHTML = '<div class="empty-msg">該当する項目がありません。</div>';
      return;
    }

    body.innerHTML = list.map(item =>
      item.id === editingId ? editRow(item) : viewRow(item)
    ).join('');
  }

  /* ---- リンクからの取り込み（#import=... ） ----
     他端末や旧バージョンからデータを移すための入口。
     現在の内容を置き換えるため、必ず確認を挟む。 */
  function importFromHash() {
    const m = location.hash.match(/^#import=(.+)$/);
    if (!m) return false;

    // 取り込みの成否にかかわらず、URLから読み込み用の文字列は消す
    const clearHash = () =>
      history.replaceState(null, '', location.pathname + location.search);

    let incoming;
    try {
      let b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';   // 末尾のパディングが欠けていても読めるように
      const bin = atob(b64);
      const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
      incoming = JSON.parse(new TextDecoder().decode(bytes));
    } catch (e) {
      clearHash();
      alert('取り込み用のデータを読み取れませんでした。');
      return false;
    }
    if (!Array.isArray(incoming) || incoming.length === 0) {
      clearHash();
      return false;
    }

    const existing = (() => {
      try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]').length; }
      catch (e) { return 0; }
    })();

    const msg = existing > 0
      ? `${incoming.length}件を取り込みます。\n現在保存されている${existing}件は置き換えられます。よろしいですか？`
      : `${incoming.length}件を取り込みます。よろしいですか？`;

    if (!confirm(msg)) { clearHash(); return false; }

    localStorage.setItem(STORE_KEY, JSON.stringify(incoming));
    localStorage.removeItem(NEXT_ID_KEY);
    clearHash();
    return true;
  }

  importFromHash();
  loadItems();
  render();
</script>
</body>
</html>
